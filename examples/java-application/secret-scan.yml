# Place at .github/workflows/secret-scan.yml in a consuming repo.
# Default is blocking. Repos with known findings pass blocking: false.
name: secret-scan

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  scan:
    uses: ffbarrie/workflow-actions/.github/workflows/scan-secrets.yml@v1
