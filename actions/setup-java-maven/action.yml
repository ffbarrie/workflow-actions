name: setup-java-maven
description: >
  Checks out the repository, installs a JDK and Maven with dependency
  caching, and optionally writes ~/.m2/settings.xml with one or more
  <server> credential entries for private repository auth, via plain
  newline-delimited id/username/password lists (no JSON required).

inputs:
  java-version:
    description: JDK version to install
    required: false
    default: "21"
  distribution:
    description: JDK distribution (temurin, corretto, zulu, ...)
    required: false
    default: temurin
  server-ids:
    description: >
      Newline-delimited list of Maven server <id> values, written as
      <server> entries in ~/.m2/settings.xml. Pairs by line position with
      server-usernames and server-passwords, so all three must have the
      same number of lines. Covers authenticating to one or more private
      repositories (e.g. GitHub Packages plus a private release repo).
    required: false
    default: ""
  server-usernames:
    description: Newline-delimited list of usernames, one per line in server-ids.
    required: false
    default: ""
  server-passwords:
    description: Newline-delimited list of passwords/tokens, one per line in server-ids.
    required: false
    default: ""
  checkout:
    description: >
      Whether to check out the repo. Set to false when a prior step in
      this job already did (setup-node, your own actions/checkout, or
      this action used earlier) — skipping avoids actions/checkout's
      default git clean wiping out anything built since that checkout.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Checkout
      if: inputs.checkout == 'true'
      uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        cache: maven

    - name: Write Maven settings.xml
      if: inputs.server-ids != ''
      shell: bash
      env:
        SERVER_IDS: ${{ inputs.server-ids }}
        SERVER_USERNAMES: ${{ inputs.server-usernames }}
        SERVER_PASSWORDS: ${{ inputs.server-passwords }}
      run: |
        set -euo pipefail
        # while-read (not readarray/mapfile) for portability to bash 3.2 (macOS runners' /bin/bash).
        ids=()
        while IFS= read -r line || [ -n "$line" ]; do ids+=("$line"); done < <(printf '%s' "$SERVER_IDS")
        usernames=()
        while IFS= read -r line || [ -n "$line" ]; do usernames+=("$line"); done < <(printf '%s' "$SERVER_USERNAMES")
        passwords=()
        while IFS= read -r line || [ -n "$line" ]; do passwords+=("$line"); done < <(printf '%s' "$SERVER_PASSWORDS")
        if [ "${#ids[@]}" -ne "${#usernames[@]}" ] || [ "${#ids[@]}" -ne "${#passwords[@]}" ]; then
          echo "::error::setup-java-maven: server-ids (${#ids[@]}), server-usernames (${#usernames[@]}), and server-passwords (${#passwords[@]}) must have the same number of lines."
          exit 1
        fi
        for i in "${!ids[@]}"; do
          if [ -z "${ids[$i]}" ] || [ -z "${usernames[$i]}" ] || [ -z "${passwords[$i]}" ]; then
            echo "::error::setup-java-maven: blank line at position $((i + 1)) in server-ids/server-usernames/server-passwords (id='${ids[$i]}', username='${usernames[$i]}'). Each must be non-empty and free of blank lines."
            exit 1
          fi
        done
        mkdir -p ~/.m2
        xml_escape() {
          sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e "s/'/\&apos;/g" -e 's/"/\&quot;/g'
        }
        {
          echo '<settings>'
          echo '  <servers>'
          for i in "${!ids[@]}"; do
            id=$(printf '%s' "${ids[$i]}" | xml_escape)
            username=$(printf '%s' "${usernames[$i]}" | xml_escape)
            password=$(printf '%s' "${passwords[$i]}" | xml_escape)
            echo '    <server>'
            echo "      <id>${id}</id>"
            echo "      <username>${username}</username>"
            echo "      <password>${password}</password>"
            echo '    </server>'
          done
          echo '  </servers>'
          echo '</settings>'
        } > ~/.m2/settings.xml

    - name: Show tool versions
      shell: bash
      run: |
        java -version
        mvn -version
