name: setup-java-maven
description: >
  Checks out the repository, installs a JDK and Maven with dependency
  caching, and optionally writes ~/.m2/settings.xml with one or more
  <server> credential entries for private repository auth, via plain
  newline-delimited id/username/password lists (no JSON required).

inputs:
  java-version:
    description: JDK version to install
    required: false
    default: "21"
  distribution:
    description: JDK distribution (temurin, corretto, zulu, ...)
    required: false
    default: temurin
  server-ids:
    description: >
      Newline-delimited list of Maven server <id> values, written as
      <server> entries in ~/.m2/settings.xml. Pairs by line position with
      server-usernames and server-passwords, so all three must have the
      same number of lines. Covers authenticating to one or more private
      repositories (e.g. GitHub Packages plus a private release repo).
      This write is authoritative: it replaces the whole file, including
      actions/setup-java's own default "github" server entry (it writes
      one using GITHUB_ACTOR/GITHUB_TOKEN whether or not you asked for
      it). If you need that github entry alongside your own servers,
      include "github" as one of your own server-ids/server-usernames/
      server-passwords lines — see the README example.
    required: false
    default: ""
  server-usernames:
    description: Newline-delimited list of usernames, one per line in server-ids.
    required: false
    default: ""
  server-passwords:
    description: Newline-delimited list of passwords/tokens, one per line in server-ids.
    required: false
    default: ""
  checkout:
    description: >
      Whether to check out the repo. Set to false when a prior step in
      this job already did (setup-node, your own actions/checkout, or
      this action used earlier) — skipping avoids actions/checkout's
      default git clean wiping out anything built since that checkout.
    required: false
    default: "true"
  fetch-depth:
    description: >
      Passed straight through to actions/checkout's fetch-depth. The
      default (1) is a shallow clone with no tag history; set to 0 for
      full history when a later step needs it — e.g. set-version's
      closest-existing-tag comparison, which silently finds no tags (and
      so silently skips its own check) on a shallow clone. Ignored when
      checkout is false.
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Checkout
      if: inputs.checkout == 'true'
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        cache: maven

    - name: Write Maven settings.xml
      if: inputs.server-ids != ''
      shell: bash
      env:
        SERVER_IDS: ${{ inputs.server-ids }}
        SERVER_USERNAMES: ${{ inputs.server-usernames }}
        SERVER_PASSWORDS: ${{ inputs.server-passwords }}
      run: ${{ github.action_path }}/write-settings.sh

    - name: Show tool versions
      shell: bash
      run: ${{ github.action_path }}/show-versions.sh
