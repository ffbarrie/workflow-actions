name: set-version
description: >
  Validates a human-entered version and writes it into the project's
  version file(s) — package.json for Node (plus, in lockstep, every
  non-private packages/*/package.json — a no-op without a packages/
  directory), pom.xml (and optionally application-release.yaml) for
  Java. On main, the version must be
  strictly greater than the closest existing release tag reachable from
  HEAD (git describe --tags --abbrev=0, matching tag-prefix). On develop,
  a hardcoded per-language dev suffix is appended to the applied version
  (-SNAPSHOT for java, -dev for node) and the comparison relaxes to
  greater-than-or-equal, since develop right after a release resync
  legitimately holds the just-tagged version as a bare number (e.g. tag
  v1.1.0, and the next dev version is 1.1.0, applied as 1.1.0-SNAPSHOT or
  1.1.0-dev). Other branches skip the tag comparison entirely but still
  validate the version's format. "develop"/"main" here mean
  github.ref_name by default, or the branch input when set — use that to
  apply develop's rules from a job whose actual ref is something else,
  e.g. proposing develop's next dev version from a release job triggered
  on main.
  Assumes checkout has already happened, with fetch-depth: 0 (tag history
  is required for the comparison) — and that language tooling (Node/npm
  or Java/Maven) is already set up, e.g. via setup-node or
  setup-java-maven earlier in the same job. Does not commit, tag, or push
  anything; that's left to later steps in the calling workflow. The
  application-release.yaml path writes app.version and app.build (a UTC
  build timestamp, yyyy-MM-ddTHH:mm:ssZ — matching the existing
  PowerShell release scripts' convention) and requires yq (present by
  default on GitHub-hosted ubuntu runners).

inputs:
  language:
    description: Which version file(s) to update — "node" or "java"
    required: true
  version:
    description: >
      Human-entered version to validate and apply, e.g. "1.4.0". A
      leading "v"/"V" is stripped automatically before validation.
    required: true
  working-directory:
    description: Directory containing package.json or pom.xml
    required: false
    default: "."
  tag-prefix:
    description: >
      Prefix used on existing release tags (e.g. "v" for v1.4.0) when
      finding the closest prior tag to compare against on develop/main.
    required: false
    default: "v"
  branch:
    description: >
      Overrides which branch's rules apply (develop vs main vs other),
      instead of the default github.ref_name. Needed when a job needs
      develop's SNAPSHOT/relaxed-comparison semantics but is actually
      running in a different ref's context — e.g. a release job
      triggered by a main-bound PR merge that also proposes the next
      develop SNAPSHOT on a throwaway branch.
    required: false
    default: ""
  update-application-release-yaml:
    description: Java only — also write app.version into application-release.yaml
    required: false
    default: "false"
  application-release-yaml-path:
    description: >
      Path to application-release.yaml, relative to working-directory.
      Defaults to the standard Maven/Spring Boot resources location. Only
      used when update-application-release-yaml is true.
    required: false
    default: "src/main/resources/application-release.yaml"

outputs:
  success:
    description: "'true' if validation and file updates succeeded, 'false' otherwise"
    value: ${{ steps.validate.outputs.success }}
  error-message:
    description: Empty on success; a human-readable reason on failure
    value: ${{ steps.validate.outputs.error-message }}
  validated-version:
    description: >
      The version that was validated and applied — no leading v, and
      with the per-language dev suffix appended (-SNAPSHOT for java,
      -dev for node) when the branch is develop. Empty on failure.
    value: ${{ steps.validate.outputs.validated-version }}

runs:
  using: composite
  steps:
    - name: Validate version
      id: validate
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
        VERSION: ${{ inputs.version }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        BRANCH: ${{ inputs.branch != '' && inputs.branch || github.ref_name }}
      run: ${{ github.action_path }}/validate-version.sh

    - name: Update package.json
      if: inputs.language == 'node'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VALIDATED_VERSION: ${{ steps.validate.outputs.validated-version }}
      run: ${{ github.action_path }}/update-package-json.sh

    - name: Update pom.xml
      if: inputs.language == 'java'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VALIDATED_VERSION: ${{ steps.validate.outputs.validated-version }}
      run: ${{ github.action_path }}/update-pom-xml.sh

    - name: Update application-release.yaml
      if: inputs.language == 'java' && inputs.update-application-release-yaml == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VALIDATED_VERSION: ${{ steps.validate.outputs.validated-version }}
        YAML_PATH: ${{ inputs.application-release-yaml-path }}
      run: ${{ github.action_path }}/update-application-release-yaml.sh
