name: release-node-application

# Reusable workflow only — no trigger of its own. The calling repo needs
# its own thin wrapper:
#
#   on:
#     pull_request:
#       types: [closed]
#       branches: [main]
#   jobs:
#     release:
#       if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
#       uses: ffbarrie/workflow-actions/.github/workflows/release-node-application.yml@v1
#       with:
#         image-name: my-app
#         registry: registry.internal.example.com
#       secrets: inherit
#
# Runs on main right after promote-to-main.yml's PR merges. Re-derives the
# release version independently (get-version + set-version) rather than
# trusting anything carried over from that PR, builds the app, then
# builds, scans, and pushes the Docker image (tagged with the release
# version and latest) via docker-build-scan-push, then tags the release.
# The release commit is never pushed to the main branch ref itself — only
# as the tag it points to, since main is typically branch-protected and a
# plain branch push would be rejected; pushing just a tag needs no
# special bypass configuration in the calling repo. Finally proposes the
# next develop version (a minor bump) as a PR back to develop, for a
# human to edit before merging if a different bump is wanted.
#
# Node's dev suffix is -dev (set-version's hardcoded per-language
# convention, mirroring Java's -SNAPSHOT), so the proposed next develop
# version comes back from set-version as e.g. 1.2.0-dev.
#
# pull_request's github.ref is the PR's merge ref, not the target branch,
# and that ref is gone once the PR closes — so every checkout here is
# pinned to an explicit ref: main rather than relying on the default.
# docker-build-scan-push's own checkout is disabled for the same reason,
# and also because its default git clean would wipe out the build output
# just produced.
#
# sibling-repo is for consumer apps whose file:../other-repo/...
# dependencies expect a sibling repo present on disk on develop, for
# developer convenience — this is where those file: refs get pinned to
# real semver before the release build, and unpinned back to file: on
# the develop sync-back branch, via pin-command/unpin-command (default
# npm run deps:pin / deps:unpin — matching the scripts this pattern was
# ported from). Left empty (the default), none of this runs.
#
# sibling-build-command (default npm ci && npm run build) runs in the
# sibling's checkout right after it, before this repo's own install —
# file: deps copy the sibling's current on-disk state as-is, so an
# unbuilt TypeScript/build-step sibling fails to resolve otherwise (same
# reasoning as build-test-node-application.yml's own sibling-build-command).
#
# Unlike build-test-node-application.yml's sibling-ref (which defaults
# to develop, for dev parity), this workflow's sibling-ref defaults to
# empty, which checkout-sibling resolves to the sibling's latest tag —
# deliberately, not incidentally: this repo's own release-*.yml
# workflows never push the release commit to main itself, only to the
# tag it points to, so a sibling's main branch HEAD can be a stale/
# dev-suffixed version even right after a real release there. Pinning
# against main would silently pin to the wrong version.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: "24"
      package-manager:
        type: string
        required: false
        default: npm
      working-directory:
        type: string
        required: false
        default: "."
      checkout-path:
        description: >
          Directory, relative to $GITHUB_WORKSPACE, to check this repo
          out into. Empty (default) checks out at $GITHUB_WORKSPACE
          root as before. Set this (and working-directory) to a
          subdirectory name when using sibling-repo, so this repo ends
          up a true sibling of the checked-out dependency on disk.
        type: string
        required: false
        default: ""
      tag-prefix:
        type: string
        required: false
        default: "v"
      registry-url:
        type: string
        required: false
        default: ""
      scope:
        type: string
        required: false
        default: ""
      build-command:
        description: Command that produces the build output docker-build-scan-push's Dockerfile expects to COPY in
        type: string
        required: false
        default: npm run build
      image-name:
        type: string
        required: true
      registry:
        type: string
        required: true
      dockerfile:
        type: string
        required: false
        default: Dockerfile
      sibling-repo:
        description: >
          owner/repo of a sibling dependency to check out, pin against,
          and unpin from (e.g. a library this app depends on via
          file:../ links on develop). Empty (default) skips all of this.
        type: string
        required: false
        default: ""
      sibling-path:
        description: Directory, relative to $GITHUB_WORKSPACE, to check the sibling out into. Required when sibling-repo is set.
        type: string
        required: false
        default: ""
      sibling-ref:
        description: Ref of the sibling to check out. Empty (default) resolves to its latest tag — see header comment for why.
        type: string
        required: false
        default: ""
      sibling-build-command:
        description: >
          Command run in sibling-path right after checkout, before this
          repo's own install. file: deps copy the sibling's current
          on-disk state as-is, so an unbuilt TypeScript/build-step
          sibling (source only, no dist/) fails to resolve at install
          time — set to "" to skip if the sibling needs no build step.
        type: string
        required: false
        default: npm ci && npm run build
      pin-command:
        description: "Command that rewrites file: deps on sibling-repo to real semver, using the sibling checkout as its version source"
        type: string
        required: false
        default: npm run deps:pin
      unpin-command:
        description: "Command that rewrites sibling-repo deps back to file: links, for the develop sync-back branch"
        type: string
        required: false
        default: npm run deps:unpin
      runs-on:
        type: string
        required: false
        default: ubuntu-latest
    secrets:
      npm-token:
        description: Auth token for the install registry, if registry-url is set
        required: false
      npmrc:
        description: >
          Optional full .npmrc content, for anything registry-url/scope
          can't express. Takes precedence over registry-url/scope when set.
        required: false
      registry-username:
        required: false
      registry-password:
        required: false
      sibling-token:
        description: Token with read access to sibling-repo (a PAT or GitHub App token). Required when sibling-repo is set.
        required: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
    steps:
      - name: Require checkout-path when using sibling-repo
        if: inputs.sibling-repo != '' && inputs.checkout-path == ''
        shell: bash
        run: |
          echo "::error::sibling-repo is set but checkout-path is empty — this repo would check out at \$GITHUB_WORKSPACE root while the sibling lands in a subdirectory, so file:../ deps can't resolve. Set checkout-path (and working-directory to match) to a subdirectory name."
          exit 1

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          path: ${{ inputs.checkout-path }}
          fetch-depth: 0

      - name: Checkout sibling
        if: inputs.sibling-repo != ''
        uses: ffbarrie/workflow-actions/actions/checkout-sibling@v1
        with:
          repository: ${{ inputs.sibling-repo }}
          path: ${{ inputs.sibling-path }}
          ref: ${{ inputs.sibling-ref }}
          token: ${{ secrets.sibling-token }}

      - name: Set up Node.js for sibling build
        if: inputs.sibling-repo != '' && inputs.sibling-build-command != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Build sibling
        if: inputs.sibling-repo != '' && inputs.sibling-build-command != ''
        shell: bash
        working-directory: ${{ inputs.sibling-path }}
        env:
          SIBLING_BUILD_COMMAND: ${{ inputs.sibling-build-command }}
        run: eval "$SIBLING_BUILD_COMMAND"

      - name: Set up Node
        uses: ffbarrie/workflow-actions/actions/setup-node@v1
        with:
          checkout: false
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          working-directory: ${{ inputs.working-directory }}
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.scope }}
          npmrc: ${{ secrets.npmrc }}

      - name: Pin sibling dependencies
        if: inputs.sibling-repo != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          PIN_COMMAND: ${{ inputs.pin-command }}
        run: eval "$PIN_COMMAND"

      - name: Get current version
        id: current
        uses: ffbarrie/workflow-actions/actions/get-version@v1
        with:
          language: node
          working-directory: ${{ inputs.working-directory }}

      - name: Set release version
        id: release-version
        uses: ffbarrie/workflow-actions/actions/set-version@v1
        with:
          language: node
          version: ${{ steps.current.outputs.base-version }}
          working-directory: ${{ inputs.working-directory }}
          tag-prefix: ${{ inputs.tag-prefix }}

      - name: Build
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: eval "$BUILD_COMMAND"

      - name: Build, scan, and push image
        uses: ffbarrie/workflow-actions/actions/docker-build-scan-push@v1
        with:
          checkout: false
          context: ${{ inputs.working-directory }}
          dockerfile: ${{ inputs.dockerfile }}
          image-name: ${{ inputs.image-name }}
          registry: ${{ inputs.registry }}
          tags: ${{ steps.release-version.outputs.validated-version }},latest
          push: true
          registry-username: ${{ secrets.registry-username }}
          registry-password: ${{ secrets.registry-password }}

      - name: Commit and tag release
        id: tag
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          VERSION: ${{ steps.release-version.outputs.validated-version }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          if [ -f package-lock.json ]; then
            git add package-lock.json
          fi
          git commit -m "release: ${VERSION}"
          tag="${TAG_PREFIX}${VERSION}"
          git tag "$tag"
          # Only the tag is pushed — never main itself, which is
          # branch-protected; this commit is reachable solely via the tag.
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Compute next development version
        id: next
        shell: bash
        env:
          RELEASED_VERSION: ${{ steps.release-version.outputs.validated-version }}
        run: |
          set -euo pipefail
          IFS='.' read -r major minor _patch <<< "$RELEASED_VERSION"
          echo "version=${major}.$((minor + 1)).0" >> "$GITHUB_OUTPUT"

      - name: Create next-development branch
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          NEXT_VERSION: ${{ steps.next.outputs.version }}
        run: git checkout -b "release/next-version-${NEXT_VERSION}"

      - name: Unpin sibling dependencies
        if: inputs.sibling-repo != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          UNPIN_COMMAND: ${{ inputs.unpin-command }}
        run: eval "$UNPIN_COMMAND"

      - name: Set next development version
        id: next-version
        uses: ffbarrie/workflow-actions/actions/set-version@v1
        with:
          language: node
          version: ${{ steps.next.outputs.version }}
          working-directory: ${{ inputs.working-directory }}
          tag-prefix: ${{ inputs.tag-prefix }}
          branch: develop

      - name: Commit and open sync-back PR
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.next-version.outputs.validated-version }}
        run: |
          set -euo pipefail
          branch=$(git rev-parse --abbrev-ref HEAD)
          git add package.json
          if [ -f package-lock.json ]; then
            git add package-lock.json
          fi
          git commit -m "chore: bump to ${NEXT_VERSION}"
          git push origin "$branch"
          gh pr create \
            --base develop \
            --head "$branch" \
            --title "Bump develop to ${NEXT_VERSION}" \
            --body "Automated post-release version bump, opened by release-node-application.yml. Edit the version in this PR before merging if a different bump (patch/major instead of minor) is wanted."
