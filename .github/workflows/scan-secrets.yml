name: scan-secrets

# Reusable workflow only — no trigger of its own. The calling repo needs
# its own thin wrapper, typically:
#
#   on:
#     pull_request:
#     push:
#       branches: [develop, main]
#     workflow_dispatch:
#   jobs:
#     scan:
#       uses: ffbarrie/workflow-actions/.github/workflows/scan-secrets.yml@v1
#       with:
#         blocking: true
#
# Language-agnostic gitleaks scan of the working tree. Default is
# blocking (fail the job on findings) so new adopters get a strict
# scan from day one. Repos with known, tracked findings (e.g.
# foundry-server's fixture allowlist still being remediated) pass
# blocking: false to stay advisory until they can flip it.
#
# If config-path exists it is passed to gitleaks; if it is missing the
# scan still runs with gitleaks' default rules, so greenfield repos
# don't need a .gitleaks.toml on day one.

on:
  workflow_call:
    inputs:
      blocking:
        description: Fail the job on findings. Default true — new adopters get it strict from day one; migrating repos with existing findings opt into advisory mode explicitly.
        type: boolean
        required: false
        default: true
      gitleaks-version:
        type: string
        required: false
        default: "8.18.4"
      config-path:
        description: Path to a gitleaks config file. Used only if the file exists.
        type: string
        required: false
        default: ".gitleaks.toml"
      runs-on:
        type: string
        required: false
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree for secrets
        shell: bash
        env:
          BLOCKING: ${{ inputs.blocking }}
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          set -euo pipefail
          args=(detect --no-git --redact --no-banner --report-format sarif --report-path gitleaks.sarif)
          if [ -n "${CONFIG_PATH}" ] && [ -f "${CONFIG_PATH}" ]; then
            args+=(--config "${CONFIG_PATH}")
          elif [ -n "${CONFIG_PATH}" ]; then
            echo "::warning::gitleaks config ${CONFIG_PATH} not found — using default rules"
          fi
          if [ "${BLOCKING}" != "true" ]; then
            args+=(--exit-code 0)
          fi
          gitleaks "${args[@]}"

      - name: Upload findings report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
