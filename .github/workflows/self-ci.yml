name: self-ci

# Validates this repo's own action.yml and .github/workflows/*.yml files
# on every push/PR — YAML validity, actionlint (GitHub Actions semantics,
# plus its own shellcheck pass on workflow run: steps), and a
# supplementary shellcheck pass on composite actions' embedded scripts
# (actionlint's schema doesn't understand action.yml, so those get no
# coverage from it otherwise — see scripts/shellcheck-actions.sh).
#
# This automates checks that were previously done by hand, ad hoc, during
# development. Nothing here is new logic — it's persisting and enforcing
# checks that already existed only as one-off terminal commands, so a
# regression gets caught on the next PR instead of the next real-world
# integration.
#
# Unlike every other workflow in this repo, this one is not reusable —
# it's this repo's own CI, triggered directly.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate YAML
        shell: bash
        run: ruby scripts/validate-yaml.rb

      - name: Download actionlint
        shell: bash
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        shell: bash
        run: ./actionlint -color

      - name: Shellcheck composite actions
        shell: bash
        run: bash scripts/shellcheck-actions.sh
