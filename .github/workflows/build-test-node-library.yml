name: build-test-node-library

# Reusable workflow only — no trigger of its own. The calling repo needs
# its own thin wrapper, typically:
#
#   on:
#     push:
#       branches: [develop]
#     pull_request:
#       branches: [develop]
#   jobs:
#     ci:
#       uses: ffbarrie/workflow-actions/.github/workflows/build-test-node-library.yml@v1
#       secrets: inherit
#
# Workspace-aware: lint/build/test run across every package when the
# manifest defines "workspaces" (npm/yarn) or via pnpm's --recursive, not
# just the root package. This is deliberately separate from
# build-test-node-application.yml (which uses plain single-package
# commands) rather than one workflow branching on package-manager AND
# monorepo-vs-single — a previous release workflow broke production by
# treating workspace packages independently instead of atomically (see
# release-node-library.yml and the earlier design discussion).
# release-node-library.yml now forces every non-private packages/*
# package to the root release version in lockstep, closing that gap.
# Keeping CI's workspace-awareness in its own file keeps that risk
# visible rather than folded into shared conditionals.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: "24"
      package-manager:
        description: npm, pnpm, or yarn
        type: string
        required: false
        default: npm
      working-directory:
        type: string
        required: false
        default: "."
      registry-url:
        type: string
        required: false
        default: ""
      scope:
        type: string
        required: false
        default: ""
      lint-command:
        description: Set to "" to skip linting
        type: string
        required: false
        default: lint
      build-command:
        type: string
        required: false
        default: build
      test-command:
        type: string
        required: false
        default: test
      runs-on:
        type: string
        required: false
        default: ubuntu-latest
    secrets:
      npm-token:
        description: Auth token for the install registry, if registry-url is set
        required: false
      npmrc:
        required: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ inputs.runs-on }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
    steps:
      - name: Set up Node
        uses: ffbarrie/workflow-actions/actions/setup-node@v1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          working-directory: ${{ inputs.working-directory }}
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.scope }}
          npmrc: ${{ secrets.npmrc }}

      - name: Lint
        if: inputs.lint-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          SCRIPT: ${{ inputs.lint-command }}
        run: |
          case "${{ inputs.package-manager }}" in
            npm)  npm run --if-present "$SCRIPT" ;;
            pnpm) pnpm --recursive run --if-present "$SCRIPT" ;;
            yarn) yarn workspaces foreach --all run "$SCRIPT" ;;
          esac

      - name: Build
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          SCRIPT: ${{ inputs.build-command }}
        run: |
          case "${{ inputs.package-manager }}" in
            npm)  npm run --if-present "$SCRIPT" ;;
            pnpm) pnpm --recursive run --if-present "$SCRIPT" ;;
            yarn) yarn workspaces foreach --all run "$SCRIPT" ;;
          esac

      - name: Test
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          SCRIPT: ${{ inputs.test-command }}
        run: |
          case "${{ inputs.package-manager }}" in
            npm)  npm run --if-present "$SCRIPT" ;;
            pnpm) pnpm --recursive run --if-present "$SCRIPT" ;;
            yarn) yarn workspaces foreach --all run "$SCRIPT" ;;
          esac
