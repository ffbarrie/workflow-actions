name: release-java-library

# Reusable workflow only — no trigger of its own. The calling repo needs
# its own thin wrapper:
#
#   on:
#     pull_request:
#       types: [closed]
#       branches: [main]
#   jobs:
#     release:
#       if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
#       uses: ffbarrie/workflow-actions/.github/workflows/release-java-library.yml@v1
#       secrets: inherit
#
# Runs on main right after promote-to-main.yml's PR merges. Re-derives the
# release version independently (get-version + set-version) rather than
# trusting anything carried over from that PR, builds and mvn deploys the
# library, then tags the release. The release commit is never pushed to
# the main branch ref itself — only as the tag it points to, since main is
# typically branch-protected and a plain branch push would be rejected;
# pushing just a tag needs no special bypass configuration in the calling
# repo. Finally proposes the next develop SNAPSHOT (a minor version bump)
# as a PR back to develop, for a human to edit before merging if a
# different bump is wanted.
#
# pull_request's github.ref is the PR's merge ref, not the target branch,
# and that ref is gone once the PR closes — so every checkout here is
# pinned to an explicit ref: main rather than relying on the default.

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        required: false
        default: "21"
      working-directory:
        type: string
        required: false
        default: "."
      tag-prefix:
        type: string
        required: false
        default: "v"
      gpg-sign:
        description: Import gpg-private-key and sign artifacts during deploy
        type: boolean
        required: false
        default: false
      runs-on:
        type: string
        required: false
        default: ubuntu-latest
    secrets:
      maven-server-ids:
        required: false
      maven-server-usernames:
        required: false
      maven-server-passwords:
        required: false
      gpg-private-key:
        required: false
      gpg-passphrase:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java + Maven
        uses: ffbarrie/workflow-actions/actions/setup-java-maven@v1
        with:
          checkout: false
          java-version: ${{ inputs.java-version }}
          server-ids: ${{ secrets.maven-server-ids }}
          server-usernames: ${{ secrets.maven-server-usernames }}
          server-passwords: ${{ secrets.maven-server-passwords }}

      - name: Import GPG key
        if: inputs.gpg-sign
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.gpg-private-key }}
          passphrase: ${{ secrets.gpg-passphrase }}

      - name: Get current version
        id: current
        uses: ffbarrie/workflow-actions/actions/get-version@v1
        with:
          language: java
          working-directory: ${{ inputs.working-directory }}

      - name: Set release version
        id: release-version
        uses: ffbarrie/workflow-actions/actions/set-version@v1
        with:
          language: java
          version: ${{ steps.current.outputs.base-version }}
          working-directory: ${{ inputs.working-directory }}
          tag-prefix: ${{ inputs.tag-prefix }}

      - name: Build and deploy
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: mvn -B -Prelease deploy

      - name: Commit and tag release
        id: tag
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          VERSION: ${{ steps.release-version.outputs.validated-version }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          # git add pom.xml '**/pom.xml' fails outright in a single-module
          # repo — ** isn't shell-expanded without bash 4's globstar (which
          # this repo avoids relying on, for portability to macOS runners'
          # bash 3.2), so git treats it as a literal, non-matching pathspec
          # and aborts the whole `git add` — including the valid pom.xml
          # argument alongside it — which silently killed every step after
          # it under set -e. find handles both single- and multi-module
          # repos without relying on shell glob features at all.
          while IFS= read -r -d '' f; do
            git add "$f"
          done < <(find . -mindepth 2 -name pom.xml -not -path '*/target/*' -print0)
          # If main's pom.xml is already at $VERSION (e.g. promote-to-main
          # merged a pom.xml that was hand-edited to a non-SNAPSHOT version
          # instead of the expected X.Y.Z-SNAPSHOT), set-version above is a
          # no-op and there's nothing staged. That's not an error — it just
          # means the release commit for this version already exists (or
          # was never needed); tag whatever HEAD already is.
          if git diff --cached --quiet; then
            echo "pom.xml already at ${VERSION}; nothing to commit, tagging HEAD as-is."
          else
            git commit -m "release: ${VERSION}"
          fi
          tag="${TAG_PREFIX}${VERSION}"
          # If this exact tag already exists, this version was already
          # fully released (commit, tag, and push all already happened) —
          # most likely a redundant workflow_dispatch re-run with nothing
          # new since. git tag would fail outright here (fatal: tag
          # already exists, exit 128), and continuing past it would try
          # to bump develop's next-dev version a second time from this
          # stale point-in-time main, which can conflict with or revert
          # real work that landed on develop since the real release.
          # Skip the rest of this job entirely instead — there's nothing
          # new to do.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists — this version was already fully released; nothing left to do."
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            git tag "$tag"
            # Only the tag is pushed — never main itself, which is
            # branch-protected; this commit is reachable solely via the tag.
            git push origin "$tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next development version
        id: next
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        env:
          RELEASED_VERSION: ${{ steps.release-version.outputs.validated-version }}
        run: |
          set -euo pipefail
          IFS='.' read -r major minor _patch <<< "$RELEASED_VERSION"
          echo "version=${major}.$((minor + 1)).0" >> "$GITHUB_OUTPUT"

      - name: Create next-development branch
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          NEXT_VERSION: ${{ steps.next.outputs.version }}
        run: git checkout -b "release/next-version-${NEXT_VERSION}"

      - name: Set next development SNAPSHOT
        id: next-snapshot
        if: steps.tag.outputs.skip != 'true'
        uses: ffbarrie/workflow-actions/actions/set-version@v1
        with:
          language: java
          version: ${{ steps.next.outputs.version }}
          working-directory: ${{ inputs.working-directory }}
          tag-prefix: ${{ inputs.tag-prefix }}
          branch: develop

      - name: Commit and open sync-back PR
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.next-snapshot.outputs.validated-version }}
        run: |
          set -euo pipefail
          branch=$(git rev-parse --abbrev-ref HEAD)
          git add pom.xml
          # git add pom.xml '**/pom.xml' fails outright in a single-module
          # repo — ** isn't shell-expanded without bash 4's globstar (which
          # this repo avoids relying on, for portability to macOS runners'
          # bash 3.2), so git treats it as a literal, non-matching pathspec
          # and aborts the whole `git add` — including the valid pom.xml
          # argument alongside it — which silently killed every step after
          # it under set -e. find handles both single- and multi-module
          # repos without relying on shell glob features at all.
          while IFS= read -r -d '' f; do
            git add "$f"
          done < <(find . -mindepth 2 -name pom.xml -not -path '*/target/*' -print0)
          # Same no-op guard as the "Commit and tag release" step: if
          # $NEXT_VERSION happens to match what's already on this branch,
          # there's nothing staged and git commit would fail under set -e.
          if git diff --cached --quiet; then
            echo "pom.xml already at ${NEXT_VERSION}; nothing to commit."
          else
            git commit -m "chore: bump to ${NEXT_VERSION}"
          fi
          git push origin "$branch"
          gh pr create \
            --base develop \
            --head "$branch" \
            --title "Bump develop to ${NEXT_VERSION}" \
            --body "Automated post-release version bump, opened by release-java-library.yml. Edit the version in this PR before merging if a different bump (patch/major instead of minor) is wanted."
